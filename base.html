<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Student Study Planner</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f0f4ff;

            text-align: center;

            padding: 40px;

        }

        .container {

            background: white;

            padding: 30px;

            border-radius: 12px;

            max-width: 500px;

            margin: auto;

        }

        input, button {

            padding: 10px;

            margin: 10px;

        }

        button {

            background-color: #6c63ff;

            color: white;

            border: none;

            cursor: pointer;

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Student Study Planner</h1>

        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
